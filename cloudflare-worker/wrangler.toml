# Configuració del Worker de Cloudflare que fa de proxy cap a openrouteservice.
# Desplegament: vegeu README.md en aquesta mateixa carpeta.

name = "zbe-routing"
main = "worker.js"
compatibility_date = "2024-11-01"

# Restringeix qui pot cridar el Worker al domini de l'app (recomanat un cop
